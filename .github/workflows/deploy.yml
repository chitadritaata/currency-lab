name: Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push currency-tracker
        uses: docker/build-push-action@v5
        with:
          context: ./currency-tracker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/currency-tracker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/currency-tracker:${{ github.sha }}

      - name: Build and push telegram-bot
        uses: docker/build-push-action@v5
        with:
          context: ./telegram-bot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/telegram-bot:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/telegram-bot:${{ github.sha }}
