#version: "3.8"

networks:
  monitor-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: currencydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monitor-net

  currency-tracker:
    build: ./currency-tracker
    container_name: currency-tracker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: currencydb
      DB_USER: admin
      DB_PASSWORD: admin123
      CBR_URL: "https://www.cbr.ru/scripts/XML_daily.asp"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - monitor-net

  telegram-bot:
    build: ./telegram-bot
    container_name: telegram-bot
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      BOT_USERNAME: "${BOT_USERNAME}"
      TRACKER_URL: "http://currency-tracker:8081"
    ports:
      - "8090:8090"
    depends_on:
      - currency-tracker
    networks:
      - monitor-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin123@postgres:5432/currencydb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - monitor-net

  docker-stats-exporter:
    image: gregmika/docker_stats_exporter:latest
    container_name: docker-stats-exporter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9273:9273"
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitor-net

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
