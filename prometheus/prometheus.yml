global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'currency-tracker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['currency-tracker:8081']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'docker-stats'
    static_configs:
      - targets: ['docker-stats-exporter:9273']
