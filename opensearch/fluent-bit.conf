[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    Parsers_File  /fluent-bit/etc/app_parsers.conf
    Parsers_File  /fluent-bit/etc/parsers_multiline.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Tag               docker.*
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   Off
    Buffer_Max_Size   1MB
    DB                /var/log/flb_docker.db
    Docker_Mode           On
    Docker_Mode_Flush     5
    Docker_Mode_Parser    java

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              app_text
    Reserve_Data        On
    Preserve_Key        Off

[OUTPUT]
    Name                 opensearch
    Match                docker.*
    Host                 opensearch
    Port                 9200
    Index                logs-%Y.%m.%d
    Suppress_Type_Name   On
